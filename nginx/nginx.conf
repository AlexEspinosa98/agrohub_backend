upstream agrohub_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # Subida de videos de AgroHubs (crear con video y /<id>/video): hasta 200 MB, igual que
    # VIDEO_MAX_BYTES en apps/agrohubs/catalogos.py.
    location ~ ^/agrohubs/ {
        client_max_body_size 200M;
        proxy_read_timeout 300s;
        proxy_pass http://agrohub_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://agrohub_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
